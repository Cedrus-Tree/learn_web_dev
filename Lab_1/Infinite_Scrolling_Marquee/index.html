<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Scrolling Marquee</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Infinite Scrolling Marquee</h1>
  <p class="subtitle">Hover the banner to pause it</p>

  <div class="banner">
    <div class="track">
      <span>HTML</span>
      <span>CSS</span>
      <span>JavaScript</span>
      <span>Git</span>
      <span>GitHub</span>
      <span>VS Code</span>
    </div>
    
    <div class="track" aria-hidden="true">
      <span>HTML</span>
      <span>CSS</span>
      <span>JavaScript</span>
      <span>Git</span>
      <span>GitHub</span>
      <span>VS Code</span>
    </div>

    <div class="track" aria-hidden="true">
      <span>HTML</span>
      <span>CSS</span>
      <span>JavaScript</span>
      <span>Git</span>
      <span>GitHub</span>
      <span>VS Code</span>
    </div>
  </div>
</body>
</html>
